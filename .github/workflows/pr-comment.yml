name: Post PR comments

on:
  workflow_run:
    workflows: ["Build & Release Python application"]
    types: [completed]

permissions: {}

jobs:
  comments:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name != github.repository

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      actions: read
      contents: read

    steps:
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@5d8df5979747514c914e1c5a12335a7cf9a2745f # v4.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Post PR preview comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;

            // Retrieve the original workflow run
            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            
            const branch = workflowRun.head_branch;
            const owner = workflowRun.head_repository?.owner?.login;
            
            if (!owner || !branch) {
              throw new Error(
                `Cannot determine PR source: owner=${owner}, branch=${branch}`
              );
            }
            
            core.info(`Searching PR for ${owner}:${branch}`);
            
            // Search open PRs first, then closed/merged ones
            let prs = [];
            
            for (const state of ["open", "closed"]) {
              const { data } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state,
                head: `${owner}:${branch}`,
                sort: "updated",
                direction: "desc",
                per_page: 100,
              });
            
              if (data.length > 0) {
                prs = data;
                break;
              }
            }
            
            if (prs.length === 0) {
              throw new Error(`No PR found for branch ${owner}:${branch}`);
            }
            
            const pr = prs[0];
            
            core.info(`Found PR #${pr.number}`);
            
            const runUrl = workflowRun.html_url;

            const body = `
            :rocket: 🦇 **Feature preview build for this pull request** 🚒☢️
  
            Test your installer, in some cases errors can happen that only happen installed. 

            BACKUP your saves! Feature previews might even be more unstable than Nightly releases, and may corrupt your saves. Also this comes from an external fork unrelated to this project.

            **PR:** #${pr.number} – ${pr.title}
            **Branch:** \`${pr.head.ref}\`
            **Commit:** \`${run.head_sha.substring(0, 8)}\`

            ### Download
            **[Download the installer from here](${runUrl})**

            Builds might get pruned after a time
            `;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            const botComment = comments.data.find(c =>
              c.user.type === "Bot" &&
              c.body.includes("Feature preview build for this pull request")
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }